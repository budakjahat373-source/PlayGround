<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#06030f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>NAGA &amp; TITAN — Jet Tempur</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070b18'/%3E%3Cpath d='M32 12l22 20-10 2 12 12-24-6-24 6 12-12-10-2z' fill='%23ff7a45'/%3E%3Ccircle cx='32' cy='34' r='6' fill='%2366f4ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="Game jet tempur Naga dan Titan"></canvas>
    <div id="vignette" aria-hidden="true"></div>
    <div id="scanlines" aria-hidden="true"></div>

    <div id="topActions" class="top-actions">
      <button id="soundBtn" class="icon-btn" type="button" aria-label="Suara" title="Suara">♪</button>
      <button id="pauseBtn" class="icon-btn" type="button" aria-label="Jeda" title="Jeda">⏸</button>
    </div>

    <button id="bombBtn" type="button" aria-label="Luncurkan bom">
      <span class="bomb-ring" aria-hidden="true"></span>
      <span class="bomb-label">BOM</span>
      <span class="bomb-count" id="bombCount">3</span>
    </button>

    <div id="overlay" class="overlay" role="dialog" aria-live="polite">
      <div id="screen" class="screen"></div>
    </div>

    <div id="rotateHint" class="rotate-hint" aria-hidden="true">
      <span>Putar perangkat untuk pengalaman terbaik</span>
    </div>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
